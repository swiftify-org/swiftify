[package]
name = "spotify-core"
version = "0.1.8"
edition = "2024"
publish = false

[dependencies]
# RUST_LOG for librespot and the core (start_logging in lib.rs)
env_logger = "=0.11.11"
hound = "3.5.1"
# a playlist read through the session (playlist.rs), as librespot reads it
http = "=1.5.0"
librespot = "=0.8.0"
rustfft = "=6.4.1"
# local music: mp3, flac, ogg vorbis, wav and aiff, and aac or apple lossless
# in an mp4 (m4a) container, all through symphonia, librespot's own decoder
# already. its flac seeks, which claxon's did not: a seek in a long flac had
# to decode its way there from the start
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "flac", "wav", "mp3", "vorbis", "mp4", "symphonia-alac", "symphonia-aiff"] }
# writes a local file's tags and cover art, which symphonia only reads
lofty = "=0.25.4"
protobuf = "=3.7.2"
serde = { version = "1", features = ["derive"] }
# reads a local file's tags and cover art (local.rs)
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aiff", "isomp4", "aac", "alac"] }
serde_json = "1"
swift-bridge = { version = "=0.1.59", features = ["async"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
swift-bridge-build = { version = "=0.1.59", optional = true }

[features]
default = ["swift"]
# the swift-bridge interface the macos and ios apps link against.
swift = ["dep:swift-bridge", "dep:swift-bridge-build"]
# a plain c abi for the linux qt front end (include/swiftify_core.h).
capi = []

[lib]
crate-type = ["staticlib"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
librespot-connect = { path = "vendor/librespot-connect" }
